{% extends "index.html" %}

{% block title %}Company Registration{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">

        <div class="card shadow-sm">
            <div class="card-body">
                <h4 class="card-title text-center mb-3">
                    Company Registration
                </h4>

                {% if error %}
                    <div class="alert alert-danger">
                        {{ error }}
                    </div>
                {% endif %}

                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Company Name</label>
                        <input
                            type="text"
                            name="company_name"
                            class="form-control"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Official Email</label>
                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label class="form-label">HR Contact</label>
                        <input
                            type="text"
                            name="hr_contact"
                            class="form-control"
                        >
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Website</label>
                        <input
                            type="url"
                            name="website"
                            class="form-control"
                        >
                    </div>

                    <div class="d-grid">
                        <button class="btn btn-success">
                            Register Company
                        </button>
                    </div>
                </form>

                <div class="mt-3 text-center">
                    <a href="/login">Already registered?</a>
                </div>

            </div>
        </div>

    </div>
</div>
{% endblock %}
