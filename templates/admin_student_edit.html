{% extends "admin.html" %}

{% block title %}Edit Student{% endblock %}

{% block admin_content %}
<h3 class="mb-3">Edit Student</h3>

<form method="POST" class="card p-4 shadow-sm">
    <div class="mb-3">
        <label class="form-label">Name</label>
        <input type="text" name="name" value="{{ student.name }}" class="form-control" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" name="email" value="{{ student.user.email }}" class="form-control" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Status</label>
        <select name="status" class="form-select" {% if student.blacklisted %}disabled{% endif %}>
            <option value="Pending" {% if student.status == "Pending" %}selected{% endif %}>Pending</option>
            <option value="Approved" {% if student.status == "Approved" %}selected{% endif %}>Approved</option>
        </select>
    </div>

    <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="blacklisted" name="blacklisted" {% if student.blacklisted %}checked{% endif %}>
        <label class="form-check-label" for="blacklisted">
            Blacklisted
        </label>
    </div>

    <div class="d-flex gap-2">
        <button class="btn btn-success" type="submit">Update Student</button>
        <a href="/admin/students" class="btn btn-secondary">Cancel</a>
    </div>
</form>
{% endblock %}
