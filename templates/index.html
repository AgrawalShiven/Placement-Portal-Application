<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>{% block title %}Placement Portal{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">Placement Portal</span>
            <div class="d-flex ms-auto">
                {% if not current_user.is_authenticated %}
                <a href="/register/student" class="btn btn-outline-light btn-sm me-2">
                    Student Register
                </a>

                <a href="/register/company" class="btn btn-outline-light btn-sm me-2">
                    Company Register
                </a>
                {% endif %}

                {% if current_user.is_authenticated %}
                <a href="/logout" class="btn btn-outline-light btn-sm">
                    Logout
                </a>
                {% endif %}
            </div>
    </nav>

    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>

</body>

</html>
